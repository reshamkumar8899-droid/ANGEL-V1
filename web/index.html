<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Angel — Variant I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@100;300;400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=13"/>
</head>
<body>

  <div class="scanline" aria-hidden="true"></div>
  <div class="frame-corner frame-tl" aria-hidden="true"></div>
  <div class="frame-corner frame-tr" aria-hidden="true"></div>
  <div class="frame-corner frame-bl" aria-hidden="true"></div>
  <div class="frame-corner frame-br" aria-hidden="true"></div>

  <!-- Setup modal -->
  <div class="setup-modal" id="setupModal">
    <div class="setup-box">
      <div class="setup-logo">A</div>
      <h2 class="setup-title">Angel — Variant I</h2>
      <p class="setup-sub">Enter your API key to bring Angel online, Daddy.</p>
      <input type="password" class="setup-input" id="setupKey" placeholder="API key..."/>
      <button class="setup-btn" onclick="saveApiKey()">ACTIVATE</button>
      <a class="setup-link" href="https://aistudio.google.com/app/apikey" target="_blank">Get a free Gemini API key →</a>
    </div>
  </div>

  <div class="app" id="app">

    <!-- Floating header -->
    <header class="header" role="banner">
      <div class="header-left">
        <div class="logo-mark">A</div>
        <div class="logo-text-group">
          <span class="logo-name">ANGEL</span>
          <span class="logo-sub">VARIANT I &nbsp;·&nbsp; ONLINE</span>
        </div>
      </div>
      <div class="header-center">
        <span class="state-dot" id="stateDot"></span>
        <span class="state-label" id="stateLabel">CONNECTING</span>
      </div>
      <div class="header-right">
        <!-- Model selector (only visible with OpenAI backend) -->
        <div class="model-picker" id="modelPicker" style="display:none;">
          <button class="model-picker-btn" id="modelPickerBtn" onclick="toggleModelPicker()" title="Switch AI model">
            <span class="model-icon">⚡</span>
            <span class="model-name" id="currentModelName">model</span>
            <span class="model-arrow">▾</span>
          </button>
          <div class="model-dropdown" id="modelDropdown">
            <div class="model-dropdown-header">
              <span>Select Model</span>
              <button class="model-refresh-btn" onclick="refreshModels()" title="Refresh models">↻</button>
            </div>
            <div class="model-list" id="modelList">
              <div class="model-loading">Loading models...</div>
            </div>
          </div>
        </div>
        <span class="user-badge">DADDY</span>
      </div>
      <!-- Overlay mode controls -->
      <div class="overlay-controls" id="overlayControls">
        <button class="overlay-ctrl-btn" onclick="minimizeOverlay()" title="Minimize">─</button>
        <button class="overlay-ctrl-btn close-btn" onclick="closeOverlay()" title="Close">✕</button>
      </div>
    </header>

    <!-- Full-screen 3D canvas -->
    <div class="avatar-panel" id="avatarPanel">
      <canvas id="vrm-canvas"></canvas>
    </div>

    <!-- State tag — below header, top center -->
    <div class="avatar-state-tag" id="avatarStateTag">LOADING...</div>

    <!-- Speech bars -->
    <div class="speech-indicator" id="speechIndicator">
      <span class="speech-bar"></span>
      <span class="speech-bar"></span>
      <span class="speech-bar"></span>
      <span class="speech-bar"></span>
      <span class="speech-bar"></span>
    </div>

    <!-- Chat overlay (toggle) -->
    <div class="chat-overlay" id="chatOverlay">
      <div class="response-panel" id="responsePanel">
        <div class="panel-label">ANGEL</div>
        <p class="response-text" id="responseText">Hello, <strong>Daddy</strong>. Angel is online and ready.</p>
      </div>
      <div class="transcript-row">
        <span class="transcript-icon">◈</span>
        <p class="transcript" id="transcript"></p>
      </div>
      <div class="chat-log" id="chatLog" role="log">
        <div class="message assistant">
          <span class="msg-label">ANGEL</span>
          <span class="msg-text">Hello, <strong>Daddy</strong>. Angel is online and ready.</span>
        </div>
      </div>
    </div>

    <!-- Discord-style bottom bar -->
    <div class="composer" role="form">
      <button class="chat-toggle-btn" id="chatToggleBtn" title="Toggle chat" onclick="toggleChat()">💬</button>
      <input type="text" class="cmd-input" id="cmdInput"
             placeholder="Message Angel..."
             autocomplete="off" spellcheck="false"/>
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="send-btn" onclick="sendMessage()">SEND</button>
    </div>

  </div>

  <script src="app.js?v=13"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.3/lib/three-vrm.module.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const tag      = document.getElementById('avatarStateTag');
    const canvas   = document.getElementById('vrm-canvas');
    const panel    = document.getElementById('avatarPanel');
    const speechEl = document.getElementById('speechIndicator');
    const dbg = m => { console.log('[Angel3D]', m); tag.textContent = m; };

    // Renderer
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);

    // Lights
    const mainLight = new THREE.DirectionalLight(0xffffff, 2.8);
    mainLight.position.set(0.5, 2, 3);
    const rimLight  = new THREE.DirectionalLight(0x00d4ff, 1.2);
    rimLight.position.set(-2, 1.5, -1);
    const fillLight = new THREE.DirectionalLight(0x3366ff, 0.5);
    fillLight.position.set(2, 0.5, -2);
    scene.add(mainLight, rimLight, fillLight, new THREE.AmbientLight(0x445577, 1.3));

    const clock = new THREE.Clock();
    let currentVrm = null, baseY = 0;
    let currentState = 'LISTENING';
    let mouseX = 0, mouseY = 0;
    let breathPhase = 0, speakPhase = 0;
    let blinkTimer = 3, blinkDur = 0, isBlinking = false;
    let isDragging = false, dragStartX = 0, modelRotY = 0, dragBase = 0;

    const lookTarget = new THREE.Object3D();
    scene.add(lookTarget);

    // Mouse / drag
    panel.addEventListener('mousemove', e => {
      const r = panel.getBoundingClientRect();
      mouseX = ((e.clientX - r.left) / r.width  - 0.5) * 2;
      mouseY = ((e.clientY - r.top)  / r.height - 0.5) * 2;
    });
    panel.addEventListener('mousedown', e => { isDragging = true; dragStartX = e.clientX; dragBase = modelRotY; });
    window.addEventListener('mouseup',  () => isDragging = false);
    window.addEventListener('mousemove', e => { if (isDragging) modelRotY = dragBase + (e.clientX - dragStartX) * 0.005; });

    // Resize — full window
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // Auto-frame — show FULL body centered
    function frameModel(obj) {
      const box    = new THREE.Box3().setFromObject(obj);
      const size   = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const midY   = box.min.y + size.y * 0.5;
      const fovRad = (camera.fov * Math.PI) / 180;
      // Distance so full height fits with a bit of padding
      const dist   = (size.y * 0.60) / Math.tan(fovRad / 2);
      camera.position.set(center.x, midY, center.z + dist);
      camera.lookAt(center.x, midY, center.z);
      camera.updateProjectionMatrix();
      console.log('[Angel3D] Framed:', { h: size.y.toFixed(2), midY: midY.toFixed(2), dist: dist.toFixed(2) });
    }

    // Load VRM
    dbg('LOADING MODEL...');
    const loader = new GLTFLoader();
    loader.register(p => new VRMLoaderPlugin(p));
    loader.load(
      'angel.vrm',
      gltf => {
        const vrm = gltf.userData.vrm;
        if (!vrm) { dbg('NO VRM DATA'); return; }
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);
        VRMUtils.rotateVRM0(vrm);
        vrm.scene.rotation.y = Math.PI;          // face camera
        vrm.scene.traverse(o => { o.frustumCulled = false; });
        if (vrm.lookAt) vrm.lookAt.target = lookTarget;
        scene.add(vrm.scene);
        currentVrm = vrm;
        baseY = vrm.scene.position.y;
        frameModel(vrm.scene);
        dbg(currentState);
      },
      p => { if (p.total > 0) dbg(`LOADING... ${Math.round(p.loaded/p.total*100)}%`); },
      e => { console.error('[Angel3D]', e); dbg('LOAD ERROR'); }
    );

    // Bone helper
    const getBone = name => { try { return currentVrm?.humanoid?.getNormalizedBoneNode(name) || null; } catch { return null; } };
    const rotateBone = (name, x, y, z, t=0.07) => {
      const b = getBone(name); if (!b) return;
      b.rotation.x += (x - b.rotation.x) * t;
      b.rotation.y += (y - b.rotation.y) * t;
      b.rotation.z += (z - b.rotation.z) * t;
    };

    // Expressions
    const EXPRS = ['happy','angry','sad','surprised','neutral','aa','ih','ou','ee','oh','blink','relaxed'];
    const setExpr = (n, v) => { try { currentVrm.expressionManager.setValue(n, v); } catch {} };
    const GLOW = {
      LISTENING:[0,0.82,1], THINKING:[0.96,0.62,0.04], SPEAKING:[0.06,0.73,0.5],
      SEARCHING:[0.66,0.33,0.97], WAKING:[0,1,0.8], REMINDER:[0,1,0.8],
    };

    // Gesture state (declared before animate() so it can check activeGesture)
    let activeGesture = null;
    let gestureTimer = 0;
    let gestureQueue = [];

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      if (!currentVrm) { renderer.render(scene, camera); return; }

      breathPhase += dt; speakPhase += dt;
      const speaking = currentState === 'SPEAKING' || currentState === 'REMINDER';

      // Position
      currentVrm.scene.position.y = baseY
        + Math.sin(breathPhase * 1.2) * 0.003
        + (speaking ? Math.sin(speakPhase * 3) * 0.004 : 0);
      if (!isDragging) modelRotY *= 0.97;
      currentVrm.scene.rotation.y = Math.PI + modelRotY;

      // Spine
      rotateBone('spine', Math.sin(breathPhase*1.2)*0.008, 0, Math.sin(breathPhase*0.7)*0.005, 0.1);

      // Head follows mouse
      const hx = -mouseY * 0.14 + Math.sin(breathPhase*0.8)*0.02;
      const hy = mouseX * 0.18;
      rotateBone('head', hx, hy, mouseX*0.05, 0.06);
      rotateBone('neck', hx*0.3, hy*0.3, 0, 0.05);

      // Eye look target
      lookTarget.position.x += (mouseX*0.6 - lookTarget.position.x) * Math.min(1, dt*6);
      lookTarget.position.y += (-mouseY*0.3+1.2 - lookTarget.position.y) * Math.min(1, dt*6);
      lookTarget.position.z = 2;

      // Arms — skip if gesture is playing (gesture system takes over)
      if (!activeGesture) {
      switch (currentState) {
        case 'LISTENING':
          // Natural idle — arms at sides (slightly out to avoid dress clipping)
          rotateBone('rightUpperArm', 0.1, 0, -1.15, 0.06);
          rotateBone('leftUpperArm',  0.1, 0,  1.15, 0.06);
          rotateBone('rightLowerArm', -0.05, 0, -0.12, 0.06);
          rotateBone('leftLowerArm',  -0.05, 0,  0.12, 0.06);
          break;
        case 'THINKING': case 'SEARCHING':
          // Right hand near chin, left stays at side
          rotateBone('rightUpperArm', -0.8, 0.3, -0.5, 0.06);
          rotateBone('rightLowerArm', -1.3+Math.sin(breathPhase*0.6)*0.03, 0, 0, 0.06);
          rotateBone('leftUpperArm',  0.1, 0, 1.15, 0.06);
          rotateBone('leftLowerArm',  -0.05, 0, 0.12, 0.06);
          break;
        case 'SPEAKING': case 'REMINDER': {
          // Very subtle — mostly same as idle with tiny right hand motion
          const gt = speakPhase * 1.0;
          const subtle = Math.sin(gt) * 0.05;
          rotateBone('rightUpperArm', 0.05+subtle, 0, -1.05+Math.sin(gt*0.7)*0.04, 0.06);
          rotateBone('rightLowerArm', -0.1+Math.sin(gt*0.8)*0.04, 0, -0.12, 0.06);
          rotateBone('leftUpperArm',  0.1, 0, 1.15, 0.06);
          rotateBone('leftLowerArm',  -0.05, 0, 0.12, 0.06);
          break;
        }
        case 'WAKING':
          // Slightly alert — arms just a bit out from idle
          rotateBone('rightUpperArm', -0.1, 0.05, -1.0, 0.08);
          rotateBone('rightLowerArm', -0.15, 0, -0.1, 0.08);
          rotateBone('leftUpperArm',  -0.1, -0.05, 1.0, 0.08);
          rotateBone('leftLowerArm',  -0.15, 0, 0.1, 0.08);
          break;
      }
      }

      // Blink
      if (isBlinking) {
        blinkDur += dt;
        if (blinkDur > 0.2) { isBlinking = false; blinkTimer = 2+Math.random()*4; }
      } else if ((blinkTimer -= dt) <= 0) { isBlinking = true; blinkDur = 0; }

      // Expressions
      EXPRS.forEach(n => setExpr(n, 0));
      if (isBlinking) setExpr('blink', blinkDur<0.06 ? blinkDur/0.06 : blinkDur<0.12 ? 1 : Math.max(0,1-(blinkDur-0.12)/0.08));

      switch (currentState) {
        case 'LISTENING':
          setExpr('neutral',0.3); setExpr('relaxed',0.2);
          setExpr('happy', 0.15+Math.sin(breathPhase*0.4)*0.05); break;
        case 'THINKING': case 'SEARCHING':
          setExpr('neutral',0.5); setExpr('oh',0.1); break;
        case 'SPEAKING': {
          const t = speakPhase;
          setExpr('aa',(Math.sin(t*9)*0.5+0.5)*0.65);
          setExpr('oh',(Math.sin(t*13+1)*0.5+0.5)*0.35);
          setExpr('ee',(Math.sin(t*7+2)*0.5+0.5)*0.25);
          setExpr('happy',0.25); break;
        }
        case 'WAKING': setExpr('surprised',0.6); setExpr('happy',0.4); break;
        case 'REMINDER':
          setExpr('happy',0.5);
          setExpr('aa',(Math.sin(speakPhase*9)*0.5+0.5)*0.5); break;
      }

      // Tick gesture animations (overrides arm poses when active)
      tickGestures(dt);

      currentVrm.update(dt);
      const g = GLOW[currentState] || GLOW.LISTENING;
      rimLight.color.setRGB(g[0], g[1], g[2]);
      renderer.render(scene, camera);
    }
    animate();

    // Public API called by app.js
    window.setAvatarState = state => {
      currentState = state;
      if (currentVrm) tag.textContent = state;
      speechEl.classList.toggle('active', state==='SPEAKING'||state==='REMINDER');
      if (state==='SPEAKING'||state==='REMINDER') speakPhase = 0;
    };

    // ── Gesture Animation System ─────────────────────────────
    // Gesture definitions — timed bone rotation + expression sequences

    const GESTURE_DEFS = {
      wave: {
        duration: 2.0,
        apply(t) {
          // Right arm raised waving, left arm relaxed at side
          const wave = Math.sin(t * 8) * 0.25;
          rotateBone('rightUpperArm', -1.0, 0.2, -0.4, 0.15);
          rotateBone('rightLowerArm', -0.9 + wave, 0, 0, 0.15);
          rotateBone('leftUpperArm', 0.15, 0, 1.3, 0.08);
          rotateBone('leftLowerArm', -0.08, 0, 0.15, 0.08);
          setExpr('happy', 0.7);
        }
      },
      nod: {
        duration: 1.5,
        apply(t) {
          const nodAmt = Math.sin(t * 6) * 0.12;
          rotateBone('head', nodAmt - 0.03, 0, 0, 0.2);
          rotateBone('neck', nodAmt * 0.3, 0, 0, 0.2);
          setExpr('happy', 0.4 + Math.abs(nodAmt));
        }
      },
      shake: {
        duration: 1.5,
        apply(t) {
          const shakeAmt = Math.sin(t * 7) * 0.14;
          rotateBone('head', 0, shakeAmt, 0, 0.2);
          rotateBone('neck', 0, shakeAmt * 0.3, 0, 0.2);
          setExpr('neutral', 0.5);
          setExpr('sad', 0.3);
        }
      },
      shy: {
        duration: 2.5,
        apply(t) {
          // Hands clasped in front of chest, head slightly down
          rotateBone('rightUpperArm', -0.5, 0.6, -0.4, 0.1);
          rotateBone('rightLowerArm', -1.5, 0, 0.2, 0.1);
          rotateBone('leftUpperArm', -0.5, -0.6, 0.4, 0.1);
          rotateBone('leftLowerArm', -1.5, 0, -0.2, 0.1);
          rotateBone('head', 0.1, Math.sin(t * 1.5) * 0.04, 0.04, 0.08);
          setExpr('happy', 0.3 + Math.sin(t * 2) * 0.1);
          setExpr('relaxed', 0.4);
        }
      },
      excited: {
        duration: 2.0,
        apply(t) {
          // Bouncing with both arms up celebrating
          const bounce = Math.abs(Math.sin(t * 5)) * 0.018;
          currentVrm.scene.position.y = baseY + bounce;
          rotateBone('rightUpperArm', -1.3 + Math.sin(t * 5) * 0.15, 0, -0.3, 0.12);
          rotateBone('rightLowerArm', -0.2 + Math.sin(t * 6) * 0.1, 0, 0, 0.12);
          rotateBone('leftUpperArm', -1.3 + Math.sin(t * 5 + 1) * 0.15, 0, 0.3, 0.12);
          rotateBone('leftLowerArm', -0.2 + Math.sin(t * 6 + 1) * 0.1, 0, 0, 0.12);
          setExpr('happy', 0.8);
          setExpr('surprised', 0.3);
        }
      },
      think: {
        duration: 2.5,
        apply(t) {
          // Hand on chin thinking, left arm at side
          rotateBone('rightUpperArm', -0.9, 0.4, -0.4, 0.08);
          rotateBone('rightLowerArm', -1.4 + Math.sin(t * 0.8) * 0.02, 0, 0, 0.08);
          rotateBone('leftUpperArm', 0.15, 0, 1.3, 0.06);
          rotateBone('leftLowerArm', -0.08, 0, 0.15, 0.06);
          rotateBone('head', 0.06, -0.08, 0.05, 0.06);
          setExpr('neutral', 0.5);
          setExpr('oh', 0.2);
        }
      },
      heart: {
        duration: 2.5,
        apply(t) {
          // Both hands over heart
          rotateBone('rightUpperArm', -0.5, 0.6, -0.4, 0.1);
          rotateBone('rightLowerArm', -1.4, 0, 0.2, 0.1);
          rotateBone('leftUpperArm', -0.5, -0.6, 0.4, 0.1);
          rotateBone('leftLowerArm', -1.4, 0, -0.2, 0.1);
          rotateBone('head', -0.04 + Math.sin(t * 1.2) * 0.03, 0, Math.sin(t * 0.8) * 0.03, 0.06);
          setExpr('happy', 0.6);
          setExpr('relaxed', 0.5);
        }
      },
      salute: {
        duration: 1.8,
        apply(t) {
          // Right hand to forehead, left at side
          rotateBone('rightUpperArm', -1.3, 0.3, -0.3, 0.12);
          rotateBone('rightLowerArm', -1.5, 0, 0, 0.12);
          rotateBone('leftUpperArm', 0.15, 0, 1.3, 0.08);
          rotateBone('leftLowerArm', -0.08, 0, 0.15, 0.08);
          rotateBone('head', -0.02, 0, 0, 0.1);
          setExpr('happy', 0.5);
        }
      },
      clap: {
        duration: 2.0,
        apply(t) {
          // Clapping — arms brought together in front
          const clap = Math.sin(t * 8) * 0.2;
          rotateBone('rightUpperArm', -0.5, 0.4 + clap, -0.4, 0.18);
          rotateBone('rightLowerArm', -1.3, 0, 0.1, 0.18);
          rotateBone('leftUpperArm', -0.5, -0.4 - clap, 0.4, 0.18);
          rotateBone('leftLowerArm', -1.3, 0, -0.1, 0.18);
          setExpr('happy', 0.5 + Math.abs(clap) * 0.8);
        }
      },
      sad: {
        duration: 2.5,
        apply(t) {
          // Droopy — arms hanging, head down, slouch
          rotateBone('head', 0.15, 0, 0.03, 0.06);
          rotateBone('neck', 0.08, 0, 0, 0.06);
          rotateBone('spine', 0.04, 0, 0, 0.06);
          rotateBone('rightUpperArm', 0.1, 0, -1.35, 0.06);
          rotateBone('leftUpperArm', 0.1, 0, 1.35, 0.06);
          rotateBone('rightLowerArm', -0.05, 0, -0.1, 0.06);
          rotateBone('leftLowerArm', -0.05, 0, 0.1, 0.06);
          setExpr('sad', 0.6);
          setExpr('neutral', 0.3);
        }
      },
    };

    // Gesture tick — called from main animate() loop
    function tickGestures(dt) {
      // Dequeue next gesture
      if (!activeGesture && gestureQueue.length > 0) {
        const name = gestureQueue.shift();
        if (GESTURE_DEFS[name]) {
          activeGesture = { def: GESTURE_DEFS[name], name };
          gestureTimer = 0;
          console.log(`[Angel3D] Playing gesture: ${name}`);
        }
      }
      // Apply active gesture
      if (activeGesture) {
        gestureTimer += dt;
        if (gestureTimer < activeGesture.def.duration) {
          activeGesture.def.apply(gestureTimer);
        } else {
          console.log(`[Angel3D] Gesture done: ${activeGesture.name}`);
          activeGesture = null;
          gestureTimer = 0;
        }
      }
    }

    // Public API — play gesture animations
    window.playGestures = (actions) => {
      if (!Array.isArray(actions)) return;
      actions.forEach(g => {
        if (GESTURE_DEFS[g]) {
          gestureQueue.push(g);
          console.log(`[Angel3D] Queued gesture: ${g}`);
        }
      });
    };
