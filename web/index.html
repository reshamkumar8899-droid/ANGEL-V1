<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Angel — Variant I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@100;300;400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=7"/>

  <!-- Three.js + VRM via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.3/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>

  <!-- Scanline overlay -->
  <div class="scanline" aria-hidden="true"></div>

  <!-- HUD corner brackets -->
  <div class="frame-corner frame-tl" aria-hidden="true"></div>
  <div class="frame-corner frame-tr" aria-hidden="true"></div>
  <div class="frame-corner frame-bl" aria-hidden="true"></div>
  <div class="frame-corner frame-br" aria-hidden="true"></div>

  <!-- Setup modal -->
  <div class="setup-modal" id="setupModal">
    <div class="setup-box">
      <div class="setup-logo">A</div>
      <h2 class="setup-title">Angel — Variant I</h2>
      <p class="setup-sub">Enter your Gemini API key to bring Angel online, Daddy.</p>
      <input type="password" class="setup-input" id="setupKey" placeholder="AIza..."/>
      <button class="setup-btn" onclick="saveApiKey()">ACTIVATE</button>
      <a class="setup-link" href="https://aistudio.google.com/app/apikey" target="_blank">Get a free API key →</a>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">

    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-left">
        <div class="logo-mark" aria-label="Angel logo">A</div>
        <div class="logo-text-group">
          <span class="logo-name">ANGEL</span>
          <span class="logo-sub">VARIANT I &nbsp;·&nbsp; ONLINE</span>
        </div>
      </div>
      <div class="header-center">
        <span class="state-dot" id="stateDot" aria-hidden="true"></span>
        <span class="state-label" id="stateLabel" aria-live="polite">CONNECTING</span>
      </div>
      <div class="header-right">
        <span class="user-badge">DADDY</span>
      </div>
    </header>

    <!-- Main two-column stage -->
    <main class="stage" role="main">

      <!-- LEFT — 3D Avatar -->
      <div class="avatar-panel" id="avatarPanel">
        <!-- Three.js canvas goes here -->
        <canvas id="vrm-canvas"></canvas>
        <!-- State tag overlay -->
        <div class="avatar-state-tag" id="avatarStateTag">LOADING MODEL...</div>
        <!-- Speech indicator -->
        <div class="speech-indicator" id="speechIndicator">
          <span class="speech-bar"></span>
          <span class="speech-bar"></span>
          <span class="speech-bar"></span>
          <span class="speech-bar"></span>
          <span class="speech-bar"></span>
        </div>
      </div>

      <!-- RIGHT — response + chat -->
      <div class="right-panel">
        <div class="response-panel">
          <div class="panel-label">ANGEL RESPONSE</div>
          <p class="response-text" id="responseText">Hello, <strong>Daddy</strong>. Angel is online and ready.</p>
        </div>
        <div class="transcript-row">
          <span class="transcript-icon" aria-hidden="true">◈</span>
          <p class="transcript" id="transcript" aria-live="polite"></p>
        </div>
        <div class="chat-section">
          <div class="chat-header">
            <span>CHANNEL</span>
            <span class="chat-header-line"></span>
            <span class="chat-header-dim">PRIMARY</span>
          </div>
          <div class="chat-log" id="chatLog" role="log" aria-label="Conversation log">
            <div class="message assistant">
              <span class="msg-label">ANGEL</span>
              <span class="msg-text">Hello, <strong>Daddy</strong>. Angel is online and ready.</span>
            </div>
          </div>
        </div>
        <div class="composer" role="form" aria-label="Command input">
          <input type="text" class="cmd-input" id="cmdInput" placeholder="Give Angel a command..." autocomplete="off" spellcheck="false" aria-label="Command input"/>
          <button class="mic-btn" id="micBtn" title="Voice input" aria-label="Toggle microphone" onclick="toggleMic()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message">SEND</button>
        </div>
      </div>

    </main>
  </div>

  <!-- Core app logic (non-module, runs first) -->
  <script src="app.js?v=7"></script>

  <!-- 3D Avatar engine (ES module) -->
  <script type="module" src="avatar3d.js?v=7"></script>
</body>
</html>
